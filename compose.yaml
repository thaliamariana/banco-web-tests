services:
  cypress-tests:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    environment:
      - CYPRESS_baseUrl=http://localhost:4000
    volumes:
      - ./cypress/reports:/e2e/cypress/reports
      - ./cypress/videos:/e2e/cypress/videos
      - ./cypress/screenshots:/e2e/cypress/screenshots