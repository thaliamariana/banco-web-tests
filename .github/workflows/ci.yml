name: E2E Regression Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run E2E tests with Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from cypress-tests

      - name: Upload Test Reports & Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-test-results
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
          retention-days: 7

      - name: Tear down containers
        if: always()
        run: docker compose down -v
  