name: E2E Regression Tests (CI)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: banco
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout E2E tests repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Initialize MySQL Database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p1234 banco << 'EOF'
          CREATE TABLE IF NOT EXISTS contas (
              id INT AUTO_INCREMENT PRIMARY KEY,
              titular VARCHAR(100) NOT NULL,
              saldo DECIMAL(10, 2) NOT NULL,
              ativa BOOLEAN DEFAULT TRUE
          );

          CREATE TABLE IF NOT EXISTS transferencias (
              id INT AUTO_INCREMENT PRIMARY KEY,
              conta_origem_id INT NOT NULL,
              conta_destino_id INT NOT NULL,
              valor DECIMAL(10, 2) NOT NULL,
              data_hora DATETIME DEFAULT CURRENT_TIMESTAMP,
              autenticada BOOLEAN DEFAULT FALSE,
              FOREIGN KEY (conta_origem_id) REFERENCES contas(id),
              FOREIGN KEY (conta_destino_id) REFERENCES contas(id)
          );

          CREATE TABLE IF NOT EXISTS usuarios (
              id INT AUTO_INCREMENT PRIMARY KEY,
              username VARCHAR(50) NOT NULL UNIQUE,
              senha VARCHAR(255) NOT NULL
          );

          INSERT INTO usuarios (username, senha) VALUES
              ('julio.lima', '123456'),
              ('junior.lima', '123456');

          INSERT INTO contas (titular, saldo, ativa) VALUES
              ('João da Silva', 10000.00, TRUE),
              ('Maria Oliveira', 10000.00, TRUE);
          EOF

      - name: Start Banco API
        run: |
          git clone https://github.com/juliodelimas/banco-api.git /tmp/banco-api
          cd /tmp/banco-api
          npm ci || npm install
          npm run rest-api &
        env:
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: 1234
          DB_NAME: banco
          JWT_SECRET: 1234
          GRAPHQLPORT: 3001

      - name: Start Banco Web Frontend
        run: |
          git clone https://github.com/juliodelimas/banco-web.git /tmp/banco-web
          cd /tmp/banco-web
          npm ci || npm install
          npm run server &
        env:
          PORT: 4000
          API_BASE_URL: http://localhost:3000

      - name: Wait for services to be ready
        run: |
          npx wait-on http://localhost:3000/api-docs http://localhost:4000 --timeout 60000

      - name: Run E2E tests with Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from cypress-tests

      - name: Upload Test Reports & Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-test-results
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
          retention-days: 7

      - name: Tear down containers
        if: always()
        run: docker compose down -v
